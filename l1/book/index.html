<script>
const au=new Audio(),vm=document.getElementById('vm'),vv=document.getElementById('vv');let cur=null;
function off(){if(cur)cur.classList.remove('on');cur=null}
au.onended=off;
document.querySelectorAll('.hs').forEach(b=>b.addEventListener('click',()=>{
  const s=b.dataset.src;
  if(s.endsWith('.mp4')){au.pause();off();vv.src=s;vm.classList.add('open');vv.play().catch(()=>{});return}
  if(cur===b&&!au.paused){au.pause();off();return}
  off();cur=b;b.classList.add('on');au.src=s;au.play().catch(off);
}));
function closeV(){vv.pause();vv.removeAttribute('src');vv.load();vm.classList.remove('open')}
document.getElementById('vx').onclick=closeV;
vm.addEventListener('click',e=>{if(e.target===vm)closeV()});
vv.onended=closeV;
</script></body></html>
